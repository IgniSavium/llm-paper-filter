function updateTheme(){const dark=document.documentElement.dataset.theme==='dark';byId('theme-toggle').textContent=dark?'☀ 浅色模式':'☾ 深色模式';byId('theme-toggle').setAttribute('aria-pressed',String(dark))}
byId('theme-toggle').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('arxiv-reader-theme',document.documentElement.dataset.theme)}catch(_){}updateTheme()});
document.querySelectorAll('#directions button').forEach(b=>b.addEventListener('click',()=>{metric=b.dataset.metric;update()}));
document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.kind;update()}));
document.querySelectorAll('[data-lower]').forEach(b=>b.addEventListener('click',()=>{lower=b.dataset.lower;update()}));
byId('rate-sources').innerHTML=data.acceptance_statistics.map(r=>'<a href="'+r.source_url+'" target="_blank" rel="noopener noreferrer" title="'+((r.source_note?r.source_note+'；':'')+(r.estimation_note?r.estimation_note+'；':'')+r.display_accepted.toLocaleString()+' / '+(r.submitted_estimated?'≈':'')+r.display_submitted.toLocaleString()+(r.accepted_count_basis==='local_snapshot'?'；录用数来自本地快照':''))+'">'+r.conference+' '+r.year+(r.rate_estimated?'（估算）':r.rate_basis==='reported_counts'?'（高校公告）':'')+'</a>').join('');
byId('include-submission').addEventListener('change',update);updateTheme();update();
</script></body></html>
